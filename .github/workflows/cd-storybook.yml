name: Continuous Delivery - Storybook

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js version'
        required: false
        type: string
        default: '24'
      pnpm_version:
        description: 'PNPM version'
        required: false
        type: string
        default: '11.13.0'
      skip_should_deploy:
        description: 'Skip the "Should I Deploy?" check'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  should-i-deploy:
    name: Should I Deploy?
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_should_deploy }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Should I Deploy?
        uses: ./.github/actions/should-i-deploy
        with:
          timezone: America/Sao_Paulo
          language: pt

  build:
    name: Build
    needs: [should-i-deploy]
    if: ${{ always() && (needs.should-i-deploy.result == 'success' || needs.should-i-deploy.result == 'skipped') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ inputs.pnpm_version || '11.13.0' }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node_version || '24' }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      - name: Build Storybook
        run: pnpm storybook:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: storybook-static

  deploy:
    name: Deploy
    needs: [build]
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Summary
        shell: bash
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "![NodeJS](https://img.shields.io/badge/node.js-6DA55F.svg?style=for-the-badge&logo=node.js&logoColor=white) ![Angular](https://img.shields.io/badge/angular-%23DD0031.svg?style=for-the-badge&logo=angular&logoColor=white) ![Storybook](https://img.shields.io/badge/-Storybook-FF4785?style=for-the-badge&logo=storybook&logoColor=white) ![GitHub Actions](https://img.shields.io/badge/github%20actions-%232671E5.svg?style=for-the-badge&logo=githubactions&logoColor=white) ![Github Pages](https://img.shields.io/badge/github%20pages-121013?style=for-the-badge&logo=github&logoColor=white)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Storybook deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "The Storybook is available at ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
